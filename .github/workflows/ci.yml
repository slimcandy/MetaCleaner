name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # ExifTool is the judge in the differential tests: it must find nothing in cleaned files.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl unzip
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
